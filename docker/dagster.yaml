# Dagster instance config, shared by every environment. Values come from the environment.
storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      db_name:
        env: DAGSTER_PG_DB
      port: 5432
      # SQLAlchemy 2.1 defaults postgresql:// to psycopg 3, but dagster-postgres is built on psycopg2.
      scheme: postgresql+psycopg2

# Runs are queued and launched by the daemon, so the Spark driver always lives in the
# dagster-daemon container (spark.driver.host=dagster-daemon in UAT).
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

# At most 2 runs at once. Across all runs, at most 1 step in a given pool runs at a time:
# bronze_form13f uses pool "delta_writes", and Delta on S3 is only safe with one writer per table
# (ADR-002). The raw download asset has no pool, so a zip can download while Bronze loads.
concurrency:
  runs:
    max_concurrent_runs: 2
  pools:
    default_limit: 1

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

telemetry:
  enabled: false
