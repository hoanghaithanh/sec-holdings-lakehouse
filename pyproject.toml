[project]
name = "sec-lakehouse"
version = "0.1.0"
description = "A Dagster + PySpark + Delta Lake lakehouse over public SEC 13F filings, with entity resolution."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dagster>=1.11,<2",
    "dagster-postgres>=0.27",
    "dagster-webserver>=1.11,<2",
    "pyspark>=3.5.3,<3.6",
    "delta-spark>=3.3,<3.4",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_lakehouse"]

[tool.dagster]
module_name = "sec_lakehouse.definitions"
code_location_name = "sec_lakehouse"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["sec_lakehouse"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "delta.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
