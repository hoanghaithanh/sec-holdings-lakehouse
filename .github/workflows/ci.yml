name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the next step can diff against the base commit
          persist-credentials: false

      # check always runs (it is a required check, and ruff also lints code blocks in Markdown).
      # This step only tells the Docker jobs below whether they can be skipped.
      - name: Detect a docs-only change
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed=""
          # Tags, new branches (before = 000...) or a missing base count as code changes.
          if [ "$GITHUB_REF_TYPE" != tag ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only --no-renames "$BASE...$HEAD") || changed=""
          fi
          docs_only=false
          # Same rule as the deploy's docs-only skip (files under docs/ or ending in .md), except
          # README.md, which the Dockerfile copies into the image.
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^docs/|\.md$' \
             && ! printf '%s\n' "$changed" | grep -qx 'README.md'; then
            docs_only=true
          fi
          printf 'Changed files:\n%s\n' "${changed:-(unknown, treated as code)}"
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache Ivy (Delta jars)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('uv.lock') }}

      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Validate Dagster definitions
        run: uv run dagster definitions validate -m sec_lakehouse.definitions

  # Runs the real Compose stack: pulls every third-party image, starts the services and
  # materializes hello_delta into the object store. Catches broken image tags and wiring.
  # Skipped for docs-only PRs: Markdown can't change the image or the Compose wiring. It always
  # runs on main, because the deploy compares against the last *deployed* commit, which can be
  # older than this push's base (an earlier code merge whose CI failed or was cancelled).
  smoke:
    needs: check
    if: github.event_name == 'push' || needs.check.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: sec-lakehouse:local
          cache-from: type=gha
      - run: cp .env.example .env
      - name: Pull third-party images
        run: docker compose pull --ignore-buildable
      - name: Start the stack
        run: docker compose up -d --no-build
      - name: Wait for the Dagster webserver
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q dagster-webserver)")
            [ "$state" = healthy ] && exit 0
            sleep 5
          done
          echo "webserver did not become healthy"; exit 1
      - name: Materialize hello_delta
        run: >
          docker compose exec -T dagster-daemon
          dagster asset materialize --select hello_delta -m sec_lakehouse.definitions
      - name: Check the Delta log landed in the object store
        run: |
          docker compose exec -T object-store sh -c \
            'curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" \
            "http://localhost:9000/lakehouse?list-type=2&prefix=bronze/hello_delta/_delta_log/"' \
            | grep -q '00000000000000000000.json'
      - name: Round-trip a raw file through the object store with boto3
        # The raw layer writes with boto3, not Spark; check it works against the real RustFS.
        run: |
          docker compose exec -T dagster-daemon python -c '
          import os, tempfile
          from sec_lakehouse.resources import LakehouseStorage
          s = LakehouseStorage(root_uri=os.environ["LAKEHOUSE_ROOT"], s3_endpoint=os.environ["S3_ENDPOINT"],
                               s3_access_key=os.environ["S3_ACCESS_KEY"], s3_secret_key=os.environ["S3_SECRET_KEY"])
          path = "raw/_smoke/hello.bin"
          assert not s.exists(path)
          with tempfile.NamedTemporaryFile(delete=False) as f:
              f.write(b"hello raw")
          s.put_new(path, f.name)
          assert s.exists(path) and b"".join(s.iter_bytes(path)) == b"hello raw"
          try:
              s.put_new(path, f.name)
          except FileExistsError:
              print("raw round-trip ok")
          else:
              raise SystemExit("put_new overwrote an existing object")
          '
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Publishes the image for UAT to pull. Pushes to main and tags only: on a PR it would just
  # build the same image smoke already built and throw it away. It runs for docs-only pushes
  # too, so a manual redeploy of main finds its sha- tag. It doesn't wait for smoke; the deploy
  # is protected because it waits for the whole CI run to succeed.
  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
