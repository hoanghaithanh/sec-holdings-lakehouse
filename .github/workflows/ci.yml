name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache Ivy (Delta jars)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('uv.lock') }}

      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Validate Dagster definitions
        run: uv run dagster definitions validate -m sec_lakehouse.definitions

  # Runs the real Compose stack: pulls every third-party image, starts the services and
  # materializes hello_delta into the object store. Catches broken image tags and wiring.
  smoke:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: sec-lakehouse:local
          cache-from: type=gha
      - run: cp .env.example .env
      - name: Pull third-party images
        run: docker compose pull --ignore-buildable
      - name: Start the stack
        run: docker compose up -d --no-build
      - name: Wait for the Dagster webserver
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q dagster-webserver)")
            [ "$state" = healthy ] && exit 0
            sleep 5
          done
          echo "webserver did not become healthy"; exit 1
      - name: Materialize hello_delta
        run: >
          docker compose exec -T dagster-daemon
          dagster asset materialize --select hello_delta -m sec_lakehouse.definitions
      - name: Check the Delta log landed in the object store
        run: |
          docker compose exec -T object-store sh -c \
            'curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" \
            "http://localhost:9000/lakehouse?list-type=2&prefix=bronze/hello_delta/_delta_log/"' \
            | grep -q '00000000000000000000.json'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      # PRs only build the image; pushes to main and tags publish it for UAT to pull.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
