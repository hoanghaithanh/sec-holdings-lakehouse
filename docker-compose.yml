# Base stack used in every environment.
#   Dev (ThanhPC):  cp .env.example .env && docker compose up --build
#   UAT (homelab):  docker compose -f docker-compose.yml -f docker-compose.uat.yml --env-file .env.uat up -d
name: sec-lakehouse

x-dagster: &dagster
  image: ${LAKEHOUSE_IMAGE:-sec-lakehouse:local}
  build:
    context: .
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  environment: &dagster-env
    LAKEHOUSE_ENV: ${LAKEHOUSE_ENV:-dev}
    SPARK_MASTER: ${SPARK_MASTER:-local[*]}
    SPARK_EXTRA_CONF: ${SPARK_EXTRA_CONF:-}
    LAKEHOUSE_ROOT: s3a://${MINIO_BUCKET:-lakehouse}
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    DAGSTER_PG_HOST: postgres
    DAGSTER_PG_USER: ${POSTGRES_USER:-dagster}
    DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    DAGSTER_PG_DB: ${POSTGRES_DB:-dagster}
  depends_on:
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dagster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dagster}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9001:9001" # MinIO console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}

  dagster-webserver:
    <<: *dagster
    ports:
      - "3000:3000" # Dagster UI

  dagster-daemon:
    <<: *dagster
    hostname: dagster-daemon
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/home/workspace.yaml"]

volumes:
  postgres-data:
  minio-data:
