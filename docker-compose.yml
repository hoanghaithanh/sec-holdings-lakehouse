# Base stack used in every environment.
#   Dev (ThanhPC):  cp .env.example .env && docker compose up --build
#   UAT (homelab):  docker compose -f docker-compose.yml -f docker-compose.uat.yml --env-file .env.uat up -d
name: sec-lakehouse

x-dagster: &dagster
  image: ${LAKEHOUSE_IMAGE:-sec-lakehouse:local}
  build:
    context: .
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  environment: &dagster-env
    LAKEHOUSE_ENV: ${LAKEHOUSE_ENV:-dev}
    SPARK_MASTER: ${SPARK_MASTER:-local[*]}
    SPARK_EXTRA_CONF: ${SPARK_EXTRA_CONF:-}
    LAKEHOUSE_ROOT: s3a://${S3_BUCKET:-lakehouse}
    S3_ENDPOINT: http://object-store:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    DAGSTER_PG_HOST: postgres
    DAGSTER_PG_USER: ${POSTGRES_USER:-dagster}
    DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    DAGSTER_PG_DB: ${POSTGRES_DB:-dagster}
  depends_on:
    postgres:
      condition: service_healthy
    object-store-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dagster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dagster}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # S3-compatible object store. RustFS is a drop-in for MinIO, whose images are no longer
  # published on Docker Hub. Spark talks to it through s3a://, so swapping stores is config only.
  object-store:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9001:9001" # object store console
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      retries: 10

  # Creates the lakehouse bucket with a signed S3 request, using curl from the same image.
  # If the bucket already exists the PUT fails, so it falls back to checking the bucket is there.
  object-store-init:
    image: rustfs/rustfs:1.0.4
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >-
        curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY"
        -X PUT "http://object-store:9000/$$S3_BUCKET" -o /dev/null
        || curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY"
        -I "http://object-store:9000/$$S3_BUCKET"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-lakehouse}

  dagster-webserver:
    <<: *dagster
    ports:
      - "3000:3000" # Dagster UI
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info')"
      interval: 5s
      start_period: 30s
      retries: 24

  dagster-daemon:
    <<: *dagster
    hostname: dagster-daemon
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/home/workspace.yaml"]

volumes:
  postgres-data:
  object-store-data:
